[package]
name = "servofetch-py"
version = "0.1.0"
edition = "2024"

[lib]
name = "servofetch"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
servo-fetch = "0.9.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
