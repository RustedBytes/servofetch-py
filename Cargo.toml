[package]
name = "servofetch-py"
version = "0.1.3"
edition = "2024"
authors = ["Yehor Smoliakov <egorsmkv@gmail.com>"]
description = "Python bindings for servo-fetch"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/RustedBytes/servofetch-py"
keywords = ["python", "pyo3", "servo", "fetch"]
categories = ["api-bindings", "web-programming"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "pyproject.toml",
    "src/**/*.rs",
]

[lib]
name = "servofetch"
crate-type = ["cdylib"]

[dependencies]
dom_query = "0.26"
onionlink-core = "0.1.2"
pyo3 = { version = "0.28", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
servo-fetch = "0.9.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
